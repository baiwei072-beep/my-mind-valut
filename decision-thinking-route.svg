<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#F8FAFC"/>
  <text x="700" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">决策思考路线</text>
  <text x="700" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#475569">目的：把焦虑里的反应，变成事实、判断、选择和同步</text>

  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="70" y="150" width="240" height="95" rx="10" fill="#111827"/>
    <text x="190" y="186" fill="#FFFFFF" font-weight="700">1. 卡住的决策</text>
    <text x="190" y="216" fill="#E5E7EB">我到底要决定什么？</text>

    <rect x="390" y="150" width="240" height="95" rx="10" fill="#1E3A5F"/>
    <text x="510" y="186" fill="#FFFFFF" font-weight="700">2. 目标</text>
    <text x="510" y="216" fill="#E5E7EB">真正要达成什么？</text>

    <rect x="710" y="150" width="240" height="95" rx="10" fill="#256D85"/>
    <text x="830" y="186" fill="#FFFFFF" font-weight="700">3. 事实</text>
    <text x="830" y="216" fill="#E0F2FE">哪些已经确认？</text>

    <rect x="1030" y="150" width="240" height="95" rx="10" fill="#2F855A"/>
    <text x="1150" y="186" fill="#FFFFFF" font-weight="700">4. 推测</text>
    <text x="1150" y="216" fill="#DCFCE7">哪些还没有证据？</text>

    <rect x="1030" y="360" width="240" height="95" rx="10" fill="#D97706"/>
    <text x="1150" y="396" fill="#FFFFFF" font-weight="700">5. 恐惧</text>
    <text x="1150" y="426" fill="#FFF7ED">我在保护什么？</text>

    <rect x="710" y="360" width="240" height="95" rx="10" fill="#7C3AED"/>
    <text x="830" y="396" fill="#FFFFFF" font-weight="700">6. 紧急度</text>
    <text x="830" y="426" fill="#F3E8FF">今天 / 明天 / 排期？</text>

    <rect x="390" y="360" width="240" height="95" rx="10" fill="#BE123C"/>
    <text x="510" y="396" fill="#FFFFFF" font-weight="700">7. 选项</text>
    <text x="510" y="426" fill="#FFE4E6">收益、代价、最大风险</text>

    <rect x="70" y="360" width="240" height="95" rx="10" fill="#0F766E"/>
    <text x="190" y="396" fill="#FFFFFF" font-weight="700">8. 选择</text>
    <text x="190" y="426" fill="#CCFBF1">最稳妥的一步</text>

    <rect x="390" y="580" width="620" height="95" rx="10" fill="#334155"/>
    <text x="700" y="616" fill="#FFFFFF" font-weight="700">9. 同步</text>
    <text x="700" y="646" fill="#E2E8F0">确认了什么 / 未确认什么 / 风险是什么 / 下一步谁在什么时候做什么</text>
  </g>

  <path d="M310,198 L385,198" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630,198 L705,198" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M950,198 L1025,198" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1150,245 L1150,355" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1030,408 L955,408" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M710,408 L635,408" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M390,408 L315,408" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M190,455 C190,560 390,628 385,628" stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
</svg>
